<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>像素祕寶迷宮 - Pixel Treasure Hunt</title>
  <!-- Google Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       1. Visual Styles & Dynamic Themes
       ========================================== */
    :root {
      --bg-color: #0d130e;
      --card-bg: #152217;
      --border-color: #6edb65;
      --text-color: #e5ffe3;
      --accent-color: #ff4757;
      --success-color: #2ed573;
      --highlight-color: #f4c430;
      --particle-color: #73e86b;
    }

    /* Dynamic Stage Themes */
    body.theme-forest {
      --bg-color: #0a120c;
      --card-bg: #132216;
      --border-color: #6edb65;
      --text-color: #e5ffe3;
      --particle-color: #73e86b;
      background-image: 
        radial-gradient(#1c3820 15%, transparent 16%),
        radial-gradient(#1c3820 15%, transparent 16%);
    }

    body.theme-ruins {
      --bg-color: #16120e;
      --card-bg: #261f18;
      --border-color: #f4c430;
      --text-color: #fff4d1;
      --particle-color: #cbb27a;
      background-image: 
        radial-gradient(#3a2e20 15%, transparent 16%),
        radial-gradient(#3a2e20 15%, transparent 16%);
    }

    body.theme-cave {
      --bg-color: #0a0b14;
      --card-bg: #121526;
      --border-color: #00d2d3;
      --text-color: #e0f8ff;
      --particle-color: #64a6bd;
      background-image: 
        radial-gradient(#1e2340 15%, transparent 16%),
        radial-gradient(#1e2340 15%, transparent 16%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans TC', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      transition: background-color 0.6s ease, color 0.6s ease;
      position: relative;
    }

    /* Topmost Overlay Canvas for Gravel/Debris Effects */
    #top-debris-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
      z-index: 9999; /* Highest overlay layer */
    }

    /* Compact & Fully Responsive Arcade Frame */
    .game-container {
      width: 100%;
      max-width: 680px;
      height: 100%;
      max-height: 92dvh;
      background-color: var(--card-bg);
      border: 4px solid var(--border-color);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.85), inset 0 0 15px rgba(0,0,0,0.8);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 5;
      overflow: hidden;
      transition: border-color 0.6s ease, background-color 0.6s ease;
    }

    /* Screen Shake Animation */
    .shake {
      animation: shake-anim 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake-anim {
      10%, 90% { transform: translate3d(-3px, 1px, 0); }
      20%, 80% { transform: translate3d(4px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 3px, 0); }
      40%, 60% { transform: translate3d(5px, -3px, 0); }
    }

    /* CRT Scanlines Effect */
    .game-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Compact Header & Progress Bar */
    .header {
      text-align: center;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 8px;
      flex-shrink: 0;
      transition: border-color 0.6s ease;
    }

    .game-title {
      font-family: 'Press Start 2P', 'Noto Sans TC', cursive;
      font-size: 1.25rem;
      color: var(--highlight-color);
      text-shadow: 2px 2px #000;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--border-color);
      font-family: monospace;
      max-width: 100%;
      margin: 0 auto;
      transition: color 0.6s ease;
    }

    /* Center Stage Area - Adaptive Flexibility */
    .stage-card {
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 14px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.6s ease;
    }

    /* Floating Animated Pixel Emoji Icon */
    .stage-icon {
      font-size: 4.5rem;
      margin-bottom: 10px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.8));
      animation: float-bounce 2.2s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes float-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Typewriter Story Container */
    .story-text-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .story-text {
      font-size: 1.15rem;
      line-height: 1.7;
      font-weight: 700;
      color: var(--text-color);
      text-align: center;
      white-space: pre-wrap;
      text-shadow: 1px 1px 3px #000;
    }

    /* Golden Flashing Cursor */
    .typing-cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background-color: var(--highlight-color);
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 0.7s infinite;
      box-shadow: 0 0 6px var(--highlight-color);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Ending Badges */
    .grade-badge {
      display: inline-block;
      font-family: 'Press Start 2P', cursive;
      font-size: 1.25rem;
      padding: 6px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      text-shadow: 2px 2px #000;
      flex-shrink: 0;
    }

    .grade-SSR { background-color: #ff4757; color: #fff; border: 2px solid #ffa502; box-shadow: 0 0 12px #ff4757; }
    .grade-SR { background-color: #1e90ff; color: #fff; border: 2px solid #70a1ff; }
    .grade-NORMAL { background-color: #747d8c; color: #fff; }
    .grade-BAD { background-color: #2f3542; color: #ff6b81; border: 2px solid #ff4757; }

    /* Control Panel & Responsive Touch Buttons */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
      width: 100%;
      flex-shrink: 0;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      background-color: #1f2533;
      color: #fff;
      border: 2px solid var(--border-color);
      padding: 14px 10px;
      font-size: 1.05rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 4px 0 #000;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-shadow: 1px 1px 2px #000;
    }

    .btn:hover {
      background-color: var(--border-color);
      color: #000;
      text-shadow: none;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #000;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 4px 0 #000 !important;
    }

    .btn-restart {
      grid-column: span 2;
      background-color: var(--success-color);
      border-color: #2ed573;
      color: #000;
      font-size: 1.2rem;
    }

    .btn-restart:hover {
      background-color: #26af5f;
      color: #fff;
    }

    /* Optimized Screen Adaptation for Mobile Viewports */
    @media (max-width: 600px) {
      .game-container { padding: 12px; max-height: 96dvh; }
      .game-title { font-size: 1rem; }
      .status-bar { font-size: 0.82rem; }
      .stage-card { padding: 12px 10px; }
      .stage-icon { font-size: 3.8rem; margin-bottom: 8px; }
      .story-text { font-size: 0.98rem; line-height: 1.6; }
      .btn-group { grid-template-columns: 1fr; gap: 8px; }
      .btn-restart { grid-column: span 1; }
      .btn { font-size: 0.95rem; padding: 12px 8px; }
      .grade-badge { font-size: 1rem; padding: 4px 10px; }
    }
  </style>
</head>
<body class="theme-forest">

  <!-- Topmost Canvas for Falling Pixel Gravel/Debris -->
  <canvas id="top-debris-canvas"></canvas>

  <div class="game-container" id="game-container">
    <!-- Header Information Area -->
    <div class="header">
      <h1 class="game-title">🌲 像素祕寶迷宮 🗿</h1>
      <div class="status-bar">
        <span id="stage-indicator">STAGE: 1 / 3 (森林)</span>
        <span id="path-history">PATH: START</span>
      </div>
    </div>

    <!-- Central Interactive Area -->
    <div class="stage-card" onclick="skipTypewriter()">
      <div id="grade-container"></div>
      <div class="stage-icon" id="stage-icon">🌲</div>
      <div class="story-text-container">
        <span class="story-text" id="story-text"></span><span class="typing-cursor" id="typing-cursor"></span>
      </div>
    </div>

    <!-- Control Buttons Area -->
    <div class="controls">
      <div class="btn-group" id="action-buttons">
        <button class="btn" onclick="makeChoice('L')">⬅️ 向左走 [A]</button>
        <button class="btn" onclick="makeChoice('R')">➡️ 向右走 [B]</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       2. Game Story Data Structure
       ========================================== */
    const storyTree = {
      "START": {
        stage: "1 / 3 (森林)",
        theme: "theme-forest",
        icon: "🌲",
        text: "你踏入古老而迷霧繚繞的神秘森林，空氣中瀰漫著泥土與未知氣息。前面的微光暗道分成了兩條岔路...",
        leftBtn: "⬅️ 巨石遺跡通道",
        rightBtn: "➡️ 水晶螢光溶洞"
      },
      // --- Stage 1 Choices (Ruins) ---
      "L": {
        stage: "2 / 3 (遺跡)",
        theme: "theme-ruins",
        icon: "🗿",
        text: "【巨石通道】穿越迷霧後，古老石牆刻滿符文。走進拱門前，面前出現兩條被藤蔓覆蓋的道路。",
        leftBtn: "⬅️ 探查古井走廊",
        rightBtn: "➡️ 走向獸吼狹道"
      },
      "R": {
        stage: "2 / 3 (遺跡)",
        theme: "theme-ruins",
        icon: "💎",
        text: "【水晶溶洞】無數發光晶石照亮地下河流，景色絢麗卻暗藏殺機。懸崖邊有兩座古老橋樑可跨越。",
        leftBtn: "⬅️ 踏上祭壇走廊",
        rightBtn: "➡️ 跨越瀑布吊橋"
      },
      // --- Stage 2 Choices (Underground Caverns) ---
      "LL": {
        stage: "3 / 3 (地底)",
        theme: "theme-cave",
        icon: "🕳️",
        text: "【古井深處】深入地底暗道，面前出現兩尊古老的守護者石像，各自伸出一隻手指向不同的巨型石門。",
        leftBtn: "⬅️ 太陽黃金門",
        rightBtn: "➡️ 月亮青銅門"
      },
      "LR": {
        stage: "3 / 3 (地底)",
        theme: "theme-cave",
        icon: "🦇",
        text: "【獸吼狹道】狹道盡頭居然是一隻沉睡的巨型岩石怪！巨獸身後有兩個通往極深處的洞口。",
        leftBtn: "⬅️ 鑽左側狹縫",
        rightBtn: "➡️ 快速衝過右側"
      },
      "RL": {
        stage: "3 / 3 (地底)",
        theme: "theme-cave",
        icon: "🔮",
        text: "【祭壇走廊】地底祭壇中央擺著一本散發紫光的古老魔導書，左右兩側各有一個神秘機關按鈕。",
        leftBtn: "⬅️ 紅寶石按鈕(力量)",
        rightBtn: "➡️ 藍寶石按鈕(智慧)"
      },
      "RR": {
        stage: "3 / 3 (地底)",
        theme: "theme-cave",
        icon: "🌉",
        text: "【瀑布吊橋】吊橋搖搖欲墜，你驚險抵達對岸。面前出現兩條通往不同深處的濕滑石階。",
        leftBtn: "⬅️ 向上高處石階",
        rightBtn: "➡️ 向下地底石階"
      },

      // --- Endings (8 Distinct Outcomes) ---
      "LLL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SSR",
        icon: "👑",
        title: "失落的法老寶藏",
        text: "門後堆滿了無盡黃金與古代法老的皇冠！你成功帶走無數寶藏，成為世上最富有、最傳奇的冒險家！"
      },
      "LLR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "BAD",
        icon: "⏳",
        title: "時光詛咒",
        text: "月亮石門觸發了古代時間陷阱！你的身體逐漸變成石頭，永遠成為了地底遺跡的一部分..."
      },
      "LRL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SR",
        icon: "🐾",
        title: "巨獸馴服者",
        text: "你靈巧地鑽過狹縫，意外發現了巨獸幼崽並給予餵食。巨獸醒來後將你視為主人，護送你帶滿寶石平安離開！"
      },
      "LRR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "BAD",
        icon: "🕳️",
        title: "陷阱坑洞",
        text: "你的腳步聲驚醒了巨獸！狂暴的巨獸一巴掌踩塌了地面，你落入無底深淵..."
      },
      "RLL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "BAD",
        icon: "💥",
        title: "貪婪的代價",
        text: "紅寶石按鈕引爆了遺跡的自爆機關！強烈的地震讓整個洞穴坍塌，你與寶藏一同被埋葬。"
      },
      "RLR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SSR",
        icon: "🧙‍♂️",
        title: "大賢者傳承",
        text: "智慧按鈕開啟了法術試煉，你獲得了古代大賢者的畢生魔法傳承與無價的知識魔法書！"
      },
      "RRL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "NORMAL",
        icon: "🏛️",
        title: "空無一物的密室",
        text: "向上走進密室，裡面只有空箱子與一張寫著「有人先來過了」的紙條。雖然沒拿到寶藏，但你平安地回到了地表。"
      },
      "RRR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SR",
        icon: "🧜‍♀️",
        title: "人魚之歌與地底湖",
        text: "向下的石階通往神秘的地底螢光湖，地底人魚贈予你一顆巨大的避水珍珠，賣出了無可估量的高價！"
      }
    };

    /* ==========================================
       3. Topmost Pixel Gravel Particles Engine
       ========================================== */
    const canvas = document.getElementById('top-debris-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class DebrisParticle {
      constructor() {
        this.reset();
      }

      reset() {
        // Spawn from top overlay region
        this.x = Math.random() * canvas.width;
        this.y = -10 - Math.random() * 40;
        this.size = Math.floor(Math.random() * 7) + 4; // Pixelated blocky shapes
        this.speedY = Math.random() * 9 + 5;           // High speed drop
        this.speedX = (Math.random() - 0.5) * 5;
        this.gravity = 0.35;
        
        // Theme aware debris colors
        const currentTheme = document.body.className;
        let palette = ['#73e86b', '#3d8238', '#99f291', '#ffffff'];
        if (currentTheme.includes('ruins')) {
          palette = ['#f4c430', '#cbb27a', '#8a7243', '#ffffff'];
        } else if (currentTheme.includes('cave')) {
          palette = ['#00d2d3', '#64a6bd', '#385375', '#e0f8ff'];
        }
        
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.opacity = 1;
      }

      update() {
        this.speedY += this.gravity;
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y > canvas.height) {
          this.opacity = 0;
        }
      }

      draw() {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        // Crisp pixel block rendering
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.restore();
      }
    }

    // Trigger Screen Shake & Explosive Pixel Debris Transition
    function triggerPixelDebrisTransition() {
      const gameContainer = document.getElementById('game-container');
      gameContainer.classList.remove('shake');
      void gameContainer.offsetWidth; // Trigger DOM reflow
      gameContainer.classList.add('shake');

      // Generate burst of pixel debris on top layer
      for (let i = 0; i < 50; i++) {
        particles.push(new DebrisParticle());
      }
    }

    function animateDebris() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].opacity <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateDebris);
    }
    animateDebris();

    /* ==========================================
       4. Game Core Logic & Typewriter Engine
       ========================================== */
    let currentPath = "START";
    let typewriterTimer = null;
    let fullText = "";
    let isTyping = false;
    const typingSpeed = 30;

    function typeWriter(text, index = 0) {
      const textElement = document.getElementById('story-text');
      const cursorElement = document.getElementById('typing-cursor');
      
      if (index === 0) {
        textElement.textContent = "";
        cursorElement.style.display = "inline-block";
        isTyping = true;
        toggleButtons(true);
      }

      if (index < text.length) {
        textElement.textContent += text.charAt(index);
        typewriterTimer = setTimeout(() => {
          typeWriter(text, index + 1);
        }, typingSpeed);
      } else {
        isTyping = false;
        cursorElement.style.display = "none";
        toggleButtons(false);
      }
    }

    function skipTypewriter() {
      if (isTyping) {
        clearTimeout(typewriterTimer);
        document.getElementById('story-text').textContent = fullText;
        document.getElementById('typing-cursor').style.display = "none";
        isTyping = false;
        toggleButtons(false);
      }
    }

    function toggleButtons(disabled) {
      const buttons = document.querySelectorAll('#action-buttons button');
      buttons.forEach(btn => btn.disabled = disabled);
    }

    function renderNode() {
      if (typewriterTimer) clearTimeout(typewriterTimer);

      const node = storyTree[currentPath];
      fullText = node.text;

      // Update background theme class
      document.body.className = node.theme;

      // Execute top-layer pixel debris animation
      triggerPixelDebrisTransition();

      document.getElementById('stage-icon').textContent = node.icon;
      
      if (node.isEnding) {
        document.getElementById('stage-indicator').textContent = "STAGE: END (終點)";
        document.getElementById('path-history').textContent = `PATH: ${formatPath(currentPath)}`;
        
        document.getElementById('grade-container').innerHTML = 
          `<span class="grade-badge grade-${node.grade}">${node.grade} - ${node.title}</span>`;
        
        document.getElementById('action-buttons').innerHTML = 
          `<button class="btn btn-restart" onclick="restartGame()">🔄 重新探險迷宮</button>`;
      } else {
        document.getElementById('stage-indicator').textContent = `STAGE: ${node.stage}`;
        document.getElementById('path-history').textContent = `PATH: ${formatPath(currentPath)}`;
        document.getElementById('grade-container').innerHTML = "";

        document.getElementById('action-buttons').innerHTML = `
          <button class="btn" onclick="makeChoice('L')">${node.leftBtn || "⬅️ 向左走"}</button>
          <button class="btn" onclick="makeChoice('R')">${node.rightBtn || "➡️ 向右走"}</button>
        `;
      }

      typeWriter(fullText);
    }

    function makeChoice(direction) {
      if (isTyping) return;
      if (currentPath === "START") {
        currentPath = direction;
      } else {
        currentPath += direction;
      }
      renderNode();
    }

    function restartGame() {
      currentPath = "START";
      renderNode();
    }

    function formatPath(path) {
      if (path === "START") return "START";
      return path.split('').map(char => char === 'L' ? '⬅️' : '➡️').join(' ');
    }

    // Initialize game state on page load
    window.onload = function() {
      renderNode();
    };
  </script>
</body>
</html>
